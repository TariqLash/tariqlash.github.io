<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="8000" preserveAspectRatio="none" viewBox="0 0 1440 8000">
  <defs>
    <radialGradient id="g-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4b89a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d4b89a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8706a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8706a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-cool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9ab0bc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9ab0bc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-neutral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8b0a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b8b0a8" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes drift1 {
        0%, 100% { transform: translate(0px, 0px); }
        25%       { transform: translate(22px, -16px); }
        50%       { transform: translate(-12px, 28px); }
        75%       { transform: translate(-26px, -8px); }
      }
      @keyframes drift2 {
        0%, 100% { transform: translate(0px, 0px); }
        33%       { transform: translate(-20px, 18px); }
        66%       { transform: translate(24px, -14px); }
      }
      @keyframes drift3 {
        0%, 100% { transform: translate(0px, 0px); }
        50%       { transform: translate(16px, 20px); }
      }
      .d1  { animation: drift1 14s ease-in-out infinite; }
      .d2  { animation: drift2 18s ease-in-out infinite; }
      .d3  { animation: drift3 11s ease-in-out infinite; }
      .d1r { animation: drift1 16s ease-in-out infinite reverse; }
      .d2r { animation: drift2 20s ease-in-out infinite reverse; }
      .d3r { animation: drift3 13s ease-in-out infinite reverse; }
    </style>
  </defs>

  <!-- Top section -->
  <ellipse class="d1"  cx="240"  cy="500"  rx="500" ry="420" fill="url(#g-warm)"/>
  <ellipse class="d2r" cx="1220" cy="780"  rx="400" ry="340" fill="url(#g-cool)"/>
  <ellipse class="d3"  cx="740"  cy="1380" rx="560" ry="480" fill="url(#g-neutral)"/>
  <ellipse class="d1r" cx="160"  cy="1880" rx="320" ry="270" fill="url(#g-rose)"/>

  <!-- Upper-mid section -->
  <ellipse class="d2"  cx="1300" cy="2350" rx="440" ry="370" fill="url(#g-warm)"/>
  <ellipse class="d3r" cx="560"  cy="2900" rx="600" ry="510" fill="url(#g-cool)"/>
  <ellipse class="d1"  cx="1100" cy="3380" rx="380" ry="310" fill="url(#g-rose)"/>

  <!-- Mid section -->
  <ellipse class="d2r" cx="290"  cy="3900" rx="520" ry="450" fill="url(#g-neutral)"/>
  <ellipse class="d3"  cx="1020" cy="4480" rx="460" ry="390" fill="url(#g-warm)"/>
  <ellipse class="d1r" cx="490"  cy="5020" rx="540" ry="470" fill="url(#g-cool)"/>

  <!-- Lower-mid section -->
  <ellipse class="d2"  cx="1200" cy="5580" rx="400" ry="340" fill="url(#g-rose)"/>
  <ellipse class="d3r" cx="660"  cy="6180" rx="570" ry="490" fill="url(#g-neutral)"/>
  <ellipse class="d1"  cx="210"  cy="6700" rx="440" ry="370" fill="url(#g-warm)"/>

  <!-- Bottom section -->
  <ellipse class="d2r" cx="1080" cy="7220" rx="420" ry="350" fill="url(#g-cool)"/>
  <ellipse class="d3"  cx="610"  cy="7700" rx="500" ry="420" fill="url(#g-neutral)"/>
  <ellipse class="d1r" cx="1310" cy="7920" rx="300" ry="250" fill="url(#g-rose)"/>
</svg>
